name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          trigger_phrase: ""
          direct_prompt: |
            Review this pull request for correctness, clarity, and consistency
            with the repository's patterns and conventions. Focus on:
            - Logic errors or edge cases
            - Missing or incorrect documentation
            - Inconsistencies with existing code patterns
            Post inline comments for specific issues and a summary comment overall.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
